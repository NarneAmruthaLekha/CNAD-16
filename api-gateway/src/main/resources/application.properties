
spring.application.name=api-gateway
server.port=8080

spring.cloud.config.enabled=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.discovery.locator.enabled=false

spring.cloud.gateway.server.webmvc.routes[0].id=change-analysis-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/changes/**

spring.cloud.gateway.server.webmvc.routes[1].id=report-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/reports/**

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only

logging.level.org.springframework.cloud.gateway=DEBUG
