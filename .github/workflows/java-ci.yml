name: CNAD Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - change-analysis-service
          - config-server
          - eureka-server
          - report-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '${{ matrix.service }}/pom.xml'

      - name: Build service
        working-directory: ${{ matrix.service }}
        run: mvn --batch-mode --no-transfer-progress clean verify